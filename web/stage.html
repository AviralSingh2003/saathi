<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saathi — demo stage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23f0b54a%27/%3E%3C/svg%3E">
  <!-- Recording layout for the demo video: the elder's device and the family member's phone side by side.
       Driven by e2e/demo-driver.mjs; captions and the end card are set from the driver. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0e1217; font-family: system-ui, "Segoe UI", sans-serif; overflow: hidden; }
    .stage { display: grid; grid-template-columns: 1fr 470px; gap: 14px; height: calc(100% - 56px); padding: 14px 14px 0; box-sizing: border-box; }
    .pane { position: relative; border-radius: 14px; overflow: hidden; background: #13181f; }
    .pane iframe { width: 100%; height: 100%; border: 0; display: block; background: #13181f; }
    .pane-label { position: absolute; top: 10px; right: 14px; z-index: 2; font-size: 13px; letter-spacing: .04em;
                  color: #f2efe8; background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 999px; }
    .caption-bar { height: 56px; display: flex; align-items: center; justify-content: center; gap: 18px; color: #f2efe8; font-size: 18px; }
    .caption-bar .pill { background: #f0b54a; color: #2a1e05; padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .caption-bar .warn { background: #c0392b; color: #fff; }
    .end { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: #0e1217; color: #f2efe8; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .8s; }
    .end.show { opacity: 1; }
    .end .logo { font-size: 72px; color: #f0b54a; }
    .end .name { font-size: 56px; font-weight: 700; margin-top: 8px; }
    .end .line { font-size: 26px; margin-top: 14px; color: #cfd6de; }
    .end .tech { font-size: 16px; margin-top: 36px; color: #8b97a5; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="pane"><iframe id="left" title="Elder view" src="about:blank"></iframe></div>
    <div class="pane"><span class="pane-label" id="right-label">Priya's phone</span>
      <iframe id="right" title="Family member's phone" src="about:blank"></iframe></div>
  </div>
  <div class="caption-bar"><span class="pill">Simulated Alexa+ experience · self-hosted MCP server</span>
    <span id="caption"></span></div>
  <div class="end" id="end">
    <div class="logo">◐</div><div class="name">Saathi</div><div class="line">Closer than distance.</div>
    <div class="tech">Self-hosted MCP server · MCP Apps · Agent Skill · Strands Agents · Claude on Amazon Bedrock</div>
  </div>
  <script>
    // Called by the driver.
    window.stage = {
      caption(text, warn = false) {
        const el = document.getElementById("caption");
        el.innerHTML = text ? `<span class="pill ${warn ? "warn" : ""}"></span>` : "";
        if (text) el.firstChild.textContent = text;
      },
      right(url, label) {
        document.getElementById("right").src = url;
        if (label) document.getElementById("right-label").textContent = label;
      },
      end(show = true) { document.getElementById("end").classList.toggle("show", show); },
    };
    const token = new URLSearchParams(location.search).get("token") || "priya-demo";
    document.getElementById("left").src = "elder.html";
    document.getElementById("right").src = `inbox.html?token=${encodeURIComponent(token)}`;
  </script>
</body>
</html>
