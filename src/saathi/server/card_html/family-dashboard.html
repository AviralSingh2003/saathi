<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family dashboard</title>
<style>
  body { margin: 0; font: 17px/1.45 system-ui, "Segoe UI", sans-serif; color: #24302a; background: transparent; }
  .card { background: #f3f8f2; border: 2px solid #b7d3b3; border-radius: 16px; padding: 16px 20px; }
  h2 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: #3d6b37; margin: 14px 0 6px; }
  h2:first-child { margin-top: 0; }
  .shared { font-size: 15px; color: #4c5d48; }
  .item { background: #fff; border-radius: 10px; padding: 10px 12px; margin: 6px 0; }
  .meta { font-size: 13px; color: #6b7a68; }
  .to_family { border-left: 5px solid #3d6b37; }
  .to_elder { border-left: 5px solid #a3b6a0; }
  .muted { color: #6b7a68; }
  .seemed { background: #fff; border-radius: 10px; padding: 10px 12px; margin: 6px 0; border-left: 5px solid #c9a227; }
  .seemed .today { font-size: 18px; }
  .days { list-style: none; margin: 8px 0 0; padding: 0; font-size: 15px; }
  .days li { padding: 3px 0; border-top: 1px solid #edf1ec; }
  .days .day { display: inline-block; min-width: 92px; color: #6b7a68; font-size: 13px; }
  .alert { border-radius: 10px; padding: 10px 12px; margin: 6px 0; background: #fff4e5; border-left: 5px solid #d9822b; }
  .alert.urgent { background: #fdecea; border-left-color: #c0392b; font-weight: 600; }
  .alert.calm { background: #eef6ee; border-left-color: #3d6b37; }
  .insight { display: inline-block; background: #fbf4dc; border-radius: 999px; padding: 3px 10px; margin: 6px 6px 0 0; font-size: 14px; }
</style>
</head>
<body>
<div class="card" id="card"><div class="muted">Loading…</div></div>
<!--CARD_RUNTIME-->
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const when = (iso) => (iso || "").replace("T", " ").slice(0, 16);
  window.McpCard.onData(({ data }) => {
    if (!data) return;
    const updates = (data.updates || []).map((u) => `
      <div class="item"><div>${esc(u.text)}</div><div class="meta">Sent ${esc(when(u.sent_at))}</div></div>`).join("")
      || `<div class="muted">No updates yet.</div>`;
    const notes = (data.notes || []).map((n) => `
      <div class="item ${n.direction}">
        <div>${esc(n.text)}</div>
        <div class="meta">${n.direction === "to_family" ? esc(data.person_name) + " replied" : "You · " + esc(n.status)} · ${esc(when(n.created_at))}</div>
      </div>`).join("") || `<div class="muted">No messages yet.</div>`;
    const URGENT = ["medical_emergency", "self_harm", "asked_for_help"];
    const alerts = (data.alerts || []).map((a) => `
      <div class="alert ${URGENT.includes(a.kind) ? "urgent" : a.kind === "all_clear" ? "calm" : ""}">
        <div>${esc(a.detail)}</div><div class="meta">${esc(when(a.ts))}</div>
      </div>`).join("");
    const alertBlock = alerts ? `<h2>Recent alerts</h2>${alerts}` : "";
    const day = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    const imp = data.impressions;
    const seemed = imp ? `
      <h2>How ${esc(data.person_name)} has seemed</h2>
      <div class="seemed">
        <div class="today">${imp.today ? esc(imp.today) : `<span class="muted">Nothing yet today.</span>`}</div>
        ${(imp.recent || []).length ? `<ul class="days">${imp.recent.map((d) =>
          `<li><span class="day">${esc(day(d.day))}</span>${esc(d.text)}</li>`).join("")}</ul>` : ""}
        ${(imp.insights || []).map((t) => `<span class="insight">${esc(t)}</span>`).join("")}
        <div class="meta" style="margin-top:8px">${esc(imp.note)}</div>
      </div>` : "";
    document.getElementById("card").innerHTML = `
      ${alertBlock}
      ${seemed}
      <h2>Updates about ${esc(data.person_name)}</h2>
      <div class="shared">${esc(data.shared_with_you)}</div>
      ${updates}
      <h2>Messages</h2>
      ${notes}`;
  });
</script>
</body>
</html>
